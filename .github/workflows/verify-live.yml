name: Verify Live Dashboard

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    name: Live Smoke Check
    runs-on: ubuntu-latest
    env:
      DASHBOARD_URL: https://co2-router-dashboard-production.up.railway.app
      ENGINE_URL: https://ecobe-engineclaude-production.up.railway.app

    steps:
      - name: Dashboard health
        run: curl -sf "${DASHBOARD_URL}/api/health"

      - name: Dashboard home
        run: curl -sf "${DASHBOARD_URL}/" | grep -q "CO2 Router"

      - name: Dashboard console
        run: curl -sf "${DASHBOARD_URL}/console" | grep -q "Carbon"

      - name: Dashboard methodology
        run: curl -sf "${DASHBOARD_URL}/methodology" | grep -q "Methodology"

      - name: Engine health
        run: curl -sf "${ENGINE_URL}/health"

      - name: Engine methodology
        run: curl -sf "${ENGINE_URL}/api/v1/methodology" | grep -q "Lowest Defensible Signal"
